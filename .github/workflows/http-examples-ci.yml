name: CI - HTTP Examples
'on':
  workflow_dispatch: {}
concurrency:
  group: release-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  catalog-integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
      - name: Verify manifest and generated surface
        run: npm run verify:manifest
    timeout-minutes: 20
  llm-surface-smoke:
    runs-on: ubuntu-latest
    needs: catalog-integrity
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
      - name: Smoke the LLM operational surface
        run: npm run smoke:llm-surface
      - name: Validate corpus promises for LLM usage
        run: npm run smoke:corpus-promises
      - name: Validate bootstrap minimum headers
        run: npm run smoke:bootstrap-minimums
    timeout-minutes: 20
